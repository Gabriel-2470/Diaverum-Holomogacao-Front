<div class="page">
  <div class="card">
    <div class="card-header">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#e86825" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      <h1>Selecione a Clínica</h1>
      <p *ngIf="nomeUsuario">Olá, <strong>{{ nomeUsuario }}</strong>. Escolha a clínica que deseja acessar:</p>
      <p *ngIf="!nomeUsuario">Escolha a clínica que deseja acessar:</p>
    </div>

    <div class="clinicas-lista">
      <button
        class="clinica-item"
        *ngFor="let u of unidades"
        (click)="selecionar(u)"
      >
        <div class="clinica-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
        </div>
        <span class="clinica-nome">{{ getNome(u) }}</span>
        <svg class="seta" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </div>

    <div class="card-footer">
      <button class="btn-sair" (click)="logout()">Sair</button>
    </div>
  </div>
</div>
